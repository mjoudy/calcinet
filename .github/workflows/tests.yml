name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (CPU)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}    # login shell so the conda env stays activated

    steps:
      - uses: actions/checkout@v4

      # Build the documented scientific environment from environment.yml.
      # Cached between runs so the conda solve is paid for only when the
      # environment file changes.
      - name: Create environment from environment.yml
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      # PyTorch is deliberately not in environment.yml (the build is per-machine).
      # CI uses the CPU wheel documented at the top of that file, so the torch_*
      # solvers are actually exercised rather than skipped.
      - name: Install PyTorch (CPU wheel)
        run: pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q
